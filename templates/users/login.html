{% extends 'base.html' %}

{% block title %}Sign In | Jazz Microfinance Bank{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="glass rounded-2xl glow-blue p-8">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center mx-auto mb-4 shadow-lg">
                <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Welcome back</h1>
            <p class="text-dark-300 mt-1 text-sm">Sign in to your Jazz Microfinance Bank account</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-dark-200 mb-1.5">Email Address</label>
                <input type="email" name="email" required
                    class="input-dark w-full px-4 py-3 rounded-xl text-sm"
                    placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-dark-200 mb-1.5">Password</label>
                <input type="password" name="password" required
                    class="input-dark w-full px-4 py-3 rounded-xl text-sm"
                    placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-primary w-full py-3 rounded-xl text-sm font-semibold glow-blue-strong">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-dark-300 mt-6">
            Don't have an account?
            <a href="{% url 'users:register' %}" class="text-brand-400 font-semibold hover:text-brand-300 transition-colors">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
